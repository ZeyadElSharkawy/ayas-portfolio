<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B: the rail</title>
<link rel="stylesheet" href="sketch.css">
<style>
.rail{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--border-stronger);margin-top:6px;overflow:hidden}
.g{display:flex;flex-direction:column;align-items:center;transition:opacity .25s;cursor:pointer}
.rail:hover .g{opacity:.25}.rail .g:hover{opacity:1}
.g.off{opacity:.12!important}
.fig{display:flex;gap:3px}
.lk{display:flex;flex-direction:column;align-items:center}
.lk i{display:block;width:1px;height:8px;background:var(--border-stronger)}
.lk .ph{width:17px;aspect-ratio:1/3.2}
.dot{width:5px;height:5px;border-radius:50%;background:var(--border-strong)}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← All sketches</a>
<h1>Concept B: the rail</h1>
<p class="lede">Hover a project to bring it forward; filter by discipline.</p>
<div class="duo">
<div class="fr" style="padding:14px 18px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="sv" style="font-size:15px">Aya Hafez</span><span class="mu">Work &nbsp; About &nbsp; CV ↓ &nbsp; Contact</span></div>
<div style="display:flex;gap:6px;margin:22px 0 14px;flex-wrap:wrap" id="f"></div>
<div class="rail" id="rail"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;align-items:end">
<div><div class="sv" id="nm" style="font-size:22px;line-height:1.1">Glacier</div><div class="mu" id="kd" style="margin-top:4px">Made by hand · 3 looks</div></div>
<div style="display:grid;gap:5px"><div class="ln"></div><div class="ln" style="width:85%"></div><div style="font-size:11px;color:var(--text-secondary);margin-top:6px">See outcome → &nbsp; Open process →</div></div>
</div>
</div>
<div class="fr" style="padding:10px;align-self:start">
<div style="display:flex;justify-content:space-between"><span class="sv" style="font-size:12px">Aya Hafez</span><span class="mu">Menu</span></div>
<div class="mu" style="margin:14px 0 4px">04 · Glacier</div>
<div style="display:grid;grid-template-columns:1fr 1fr 0.35fr;gap:5px;border-top:1px solid var(--border-stronger);padding-top:8px"><div class="ph" style="aspect-ratio:1/2.2"></div><div class="ph" style="aspect-ratio:1/2.2"></div><div class="ph" style="aspect-ratio:1/6.3"></div></div>
<div class="mu" style="margin-top:8px;text-align:center">swipe the rail ⟷</div>
<div style="display:flex;justify-content:center;gap:4px;margin-top:6px"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="width:14px;height:5px;border-radius:3px;background:var(--text-secondary)"></span><span class="dot"></span></div>
</div>
</div>
</main>
<script>
const P=[['Cultural Echoes','hand',3],['Carina Arabesque','hand',2],['Glacier','hand',3],['Into Her Skin','hand',1],['Arabia','digital',3],['Identity Breakdown','digital',2],['Clue','styling',3]];
const L={hand:'Made by hand',digital:'Digital (CLO 3D)',styling:'Styling'};
const rail=document.getElementById('rail');
P.forEach(p=>{const g=document.createElement('div');g.className='g';g.dataset.k=p[1];
g.innerHTML=`<div class="fig">${'<div class="lk"><i></i><div class="ph"></div></div>'.repeat(p[2])}</div><div class="mu" style="margin-top:6px;white-space:nowrap">${p[0].split(' ')[0]}</div>`;
g.onmouseenter=()=>{document.getElementById('nm').textContent=p[0];document.getElementById('kd').textContent=L[p[1]]+' · '+p[2]+' look'+(p[2]>1?'s':'')};
rail.appendChild(g)});
const f=document.getElementById('f');
[['all','All'],['hand','Made by hand'],['digital','Digital'],['styling','Styling']].forEach(([k,t],i)=>{const b=document.createElement('button');b.className='chip'+(i?'':' on');b.textContent=t;
b.onclick=()=>{f.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');rail.querySelectorAll('.g').forEach(g=>g.classList.toggle('off',k!=='all'&&g.dataset.k!==k))};f.appendChild(b)});
</script>
</body>
</html>
